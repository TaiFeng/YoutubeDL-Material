name: docker-release

# Builds the Docker image and pushes it to this repository's GitHub Container Registry
# (ghcr.io/<owner>/youtubedl-material). Only needs the built-in GITHUB_TOKEN, no extra secrets.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Docker tag (e.g. 4.3.3)'
        required: true
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: create version.json
        run: |
          echo "{\"type\": \"docker\", \"tag\": \"latest\", \"commit\": \"$(git rev-parse --short HEAD)\", \"date\": \"$(date +'%Y-%m-%d')\"}" > backend/version.json

      - name: Set image tag
        id: tags
        run: |
          if [ "${{ github.event.inputs.tags }}" != "" ]; then
            TAG="${{ github.event.inputs.tags }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            echo "Unknown workflow trigger: ${{ github.event_name }}! Cannot determine default tag."
            exit 1
          fi
          # docker tags don't use the leading 'v' (v4.3.3 -> 4.3.3)
          echo "tags=${TAG#v}" >> "$GITHUB_OUTPUT"
          # ghcr.io image names must be lowercase
          OWNER="${{ github.repository_owner }}"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker image metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.tags.outputs.owner }}/youtubedl-material
          tags: |
            type=raw,value=${{ steps.tags.outputs.tags }}
            type=raw,value=latest

      - name: setup docker build
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # x86 only; add linux/arm64 back (with docker/setup-qemu-action) for ARM hosts
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
